[package]
name = "wgvb-serve"
description = "A local web viewer for a WGVB seed, with hex-direction scrolling"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true

[lib]
name = "wgvb_serve"
path = "src/lib.rs"

[[bin]]
name = "wgvb-serve"
path = "src/main.rs"

[dependencies]
wgvb.workspace = true
wgvb-render.workspace = true
clap.workspace = true
thiserror.workspace = true

# `wgvb-store` arrived with `--db`. DESIGN.md section 29.1 always said the
# server would take a database once persistence existed — the database supplies
# the seed, algorithm version, and effective configuration, and the seed in the
# route becomes a check against the stored one — so this edge was planned, and
# section 28's graph now draws it. It points the same direction as every other
# edge in the workspace: toward the core, never away from it.
wgvb-store.workspace = true

# `tiny_http` rather than `axum` and `tokio`. The work this server does is
# CPU-bound rendering with no IO to overlap, so an async runtime would buy
# nothing and cost about eighty crates; a blocking server and a fixed worker
# pool is the shape of the problem. See DESIGN.md appendix B.
tiny_http.workspace = true

# The binary never decodes an image; the tests do, because section 29 requires
# rendered output to be compared as decoded RGBA rather than as file bytes.
[dev-dependencies]
png.workspace = true

[lints]
workspace = true
