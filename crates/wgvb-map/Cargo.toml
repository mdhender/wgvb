[package]
name = "wgvb-map"
description = "Diagnostic and player-facing map renderer for WGVB"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true

[[bin]]
name = "wgvb-map"
path = "src/main.rs"

[dependencies]
wgvb.workspace = true
wgvb-store.workspace = true
wgvb-render.workspace = true
clap.workspace = true

# `png` is a dev-dependency only. The binary never decodes: it writes what
# `wgvb-render` encoded. Section 29 requires that rendered output be compared as
# decoded RGBA rather than as file bytes, and proving this command actually
# wrote a readable image needs a decoder.
[dev-dependencies]
png.workspace = true

[lints]
workspace = true
