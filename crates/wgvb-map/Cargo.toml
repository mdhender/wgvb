[package]
name = "wgvb-map"
description = "Diagnostic and player-facing map renderer for WGVB"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true

[[bin]]
name = "wgvb-map"
path = "src/main.rs"

[dependencies]
wgvb.workspace = true
wgvb-store.workspace = true

# `--config` renders a tuned configuration, which is what `wgvb-tune`
# downloads. One crate defines that file's format; this one reads it.
wgvb-config.workspace = true
wgvb-render.workspace = true
clap.workspace = true

# `png` is a dev-dependency only. The binary never decodes: it writes what
# `wgvb-render` encoded. Section 29 requires that rendered output be compared as
# decoded RGBA rather than as file bytes, and proving this command actually
# wrote a readable image needs a decoder.
#
# `wgvb-serve` is a dev-dependency, and the arrow points backwards on purpose.
# Two front ends over one renderer must not be allowed to drift, so one test
# runs this binary and compares its bytes with the server's `map.png` route.
# The test has to live here because `CARGO_BIN_EXE_wgvb-map` only exists for
# this package's own tests. Nothing in `src/` sees it, no cycle exists —
# `wgvb-serve` does not depend on `wgvb-map` — and it does not appear in a
# consumer's graph, the same standing `ciborium` has in `wgvb`.
[dev-dependencies]
# The agreement tests drive the two web front ends as libraries rather than
# over a socket. Each is a dev-dependency of this crate and not the other way
# round, so the dependency graph in DESIGN.md section 28 is unchanged.
wgvb-tune.workspace = true
png.workspace = true
wgvb-render.workspace = true
wgvb-serve.workspace = true

[lints]
workspace = true
