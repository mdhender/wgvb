[package]
name = "wgvb"
description = "Deterministic, effectively unbounded procedural hex-world generator"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true

# The core generator has no persistence, no rendering, and no hex-geometry
# dependency. This is enforced by the dependency graph, not by convention:
# see DESIGN.md section 28.
[dependencies]
thiserror.workspace = true
serde.workspace = true

# `ciborium` is a dev-dependency only. DESIGN.md section 21.2 makes canonical
# CBOR the configuration's stable serialization, and section 21.1 requires that
# an older binary *reject* a world file carrying an unknown field. Proving
# `deny_unknown_fields` actually fires needs a real format, and this is the
# format the design chose. It is not a dependency of the library itself: the
# core crate still ships with exactly `serde` and `thiserror`.
[dev-dependencies]
ciborium.workspace = true

[lints]
workspace = true
